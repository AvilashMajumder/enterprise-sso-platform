<!DOCTYPE html>
<html lang="en"
      xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Demo App 2    | Organization SSO</title>

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: Arial, sans-serif;
            background: #f4f7fb;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
        }

        nav {
            height: 70px;
            background: #172554;
            color: white;
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0 8%;
        }

        .logo {
            font-size: 22px;
            font-weight: bold;
        }

        .app-name {
            font-size: 14px;
            opacity: 0.8;
        }

        main {
            flex: 1;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 40px 20px;
        }

        .card {
            background: white;
            width: 100%;
            max-width: 650px;
            padding: 50px;
            border-radius: 16px;
            text-align: center;
            box-shadow: 0 10px 35px rgba(0, 0, 0, 0.08);
        }

        .badge {
            display: inline-block;
            background: #e0e7ff;
            color: #3730a3;
            padding: 7px 14px;
            border-radius: 20px;
            font-size: 13px;
            font-weight: bold;
            margin-bottom: 20px;
        }

        h1 {
            color: #172554;
            margin-bottom: 15px;
            font-size: 34px;
        }

        .description {
            color: #64748b;
            line-height: 1.7;
            margin-bottom: 30px;
        }

        .login-button {
            display: inline-block;
            padding: 14px 28px;
            background: #2563eb;
            color: white;
            text-decoration: none;
            border-radius: 8px;
            font-weight: bold;
            transition: 0.2s;
        }

        .login-button:hover {
            background: #1d4ed8;
        }

        .profile-button {
            display: inline-block;
            padding: 14px 28px;
            background: #16a34a;
            color: white;
            text-decoration: none;
            border-radius: 8px;
            font-weight: bold;
        }

        .welcome {
            color: #475569;
            margin-bottom: 25px;
        }

        footer {
            text-align: center;
            padding: 20px;
            color: #94a3b8;
            font-size: 13px;
        }
    </style>
</head>

<body>

<nav>
    <div class="logo">
        Organization SSO
    </div>

    <div class="app-name">
        Demo Application 2
    </div>
</nav>

<main>

    <div class="card">

        <div class="badge">
            ENTERPRISE APPLICATION
        </div>

        <h1>Welcome</h1>

        <p class="description">
            Access Demo Application 2 securely using
            your organization's Single Sign-On platform.
        </p>

        <!-- NOT LOGGED IN -->
        <div sec:authorize="isAnonymous()">

            <a class="login-button"
               href="/oauth2/authorization/keycloak">
                Login with Organization SSO
            </a>

        </div>

        <!-- LOGGED IN -->
        <div sec:authorize="isAuthenticated()">

            <p class="welcome">
                Welcome back,
                <strong sec:authentication="principal.fullName">
                    User
                </strong>
            </p>

            <a class="profile-button"
               href="/profile">
                Go to My Profile
            </a>

        </div>

    </div>

</main>

<footer>
    Protected by Organization SSO
</footer>

</body>

</html>
