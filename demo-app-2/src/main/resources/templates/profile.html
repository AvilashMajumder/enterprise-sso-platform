<!DOCTYPE html>
<html lang="en"
      xmlns:th="http://www.thymeleaf.org">

<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Profile | Demo App 2</title>

    <style>

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: Arial, sans-serif;
            background: #f4f7fb;
            min-height: 100vh;
        }

        nav {
            height: 70px;
            background: #172554;
            color: white;
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0 8%;
        }

        .logo {
            font-size: 22px;
            font-weight: bold;
        }

        .app-name {
            font-size: 14px;
            opacity: 0.8;
        }

        .container {
            max-width: 850px;
            margin: 60px auto;
            padding: 20px;
        }

        .card {
            background: white;
            border-radius: 16px;
            padding: 40px;
            box-shadow: 0 10px 35px rgba(0, 0, 0, 0.08);
        }

        h1 {
            color: #172554;
            margin-bottom: 10px;
        }

        .subtitle {
            color: #64748b;
            margin-bottom: 35px;
        }

        .profile-info {
            border-top: 1px solid #e2e8f0;
        }

        .row {
            display: flex;
            justify-content: space-between;
            padding: 18px 5px;
            border-bottom: 1px solid #e2e8f0;
        }

        .label {
            color: #64748b;
            font-weight: bold;
        }

        .value {
            color: #172554;
        }

        .actions {
            margin-top: 35px;
            display: flex;
            gap: 15px;
        }

        .home-button {
            padding: 12px 22px;
            background: #e2e8f0;
            color: #172554;
            text-decoration: none;
            border-radius: 8px;
            font-weight: bold;
        }

        .logout-button {
            padding: 12px 22px;
            background: #dc2626;
            color: white;
            border: none;
            border-radius: 8px;
            font-weight: bold;
            cursor: pointer;
        }

        .logout-button:hover {
            background: #b91c1c;
        }

    </style>

</head>

<body>

<nav>

    <div class="logo">
        Organization SSO
    </div>

    <div class="app-name">
        Demo Application 2
    </div>

</nav>

<div class="container">

    <div class="card">

        <h1>My Profile</h1>

        <p class="subtitle">
            Your identity information provided by the organization SSO platform.
        </p>

        <div class="profile-info">

            <div class="row">
                <span class="label">Name</span>
                <span class="value" th:text="${name}">
                    User
                </span>
            </div>

            <div class="row">
                <span class="label">Username</span>
                <span class="value" th:text="${username}">
                    username
                </span>
            </div>

            <div class="row">
                <span class="label">Email</span>
                <span class="value" th:text="${email}">
                    email
                </span>
            </div>

        </div>

        <div class="actions">

            <a class="home-button"
               href="/">
                Home
            </a>

            <form method="post"
                  th:action="@{/logout}">

                <button class="logout-button"
                        type="submit">
                    Logout
                </button>

            </form>

        </div>

    </div>

</div>

</body>

</html>
